[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
# One version for the tree. Nothing here is published, and the only consumers
# are path dependencies inside this workspace, so per-crate versions would be
# numbers no tool reads. A crate gets its own when it gets published, not before.
version = "0.4.0"
edition = "2024"
# Pinned rather than tracking stable so a contributor on an older toolchain
# gets a clear error instead of a confusing one. Raise it deliberately.
rust-version = "1.98"
license = "AGPL-3.0-only"
authors = ["eth0net <eth0net@pm.me>"]
repository = "https://github.com/eth0net/manaweb"

# Versions live here so two crates can't drift apart, and a member declaring
# `workspace = true` against a different version is a build error rather than
# something noticed later. Features are added per crate where they differ.
[workspace.dependencies]
manaweb-api = { path = "crates/api" }
manaweb-core = { path = "crates/core" }
manaweb-scryfall = { path = "crates/scryfall" }

async-compression = { version = "0.4.44", features = ["gzip", "tokio"] }
axum = "0.8.9"
futures-util = { version = "0.3.34", default-features = false }
reqwest = { version = "0.13.4", features = ["json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
sqlx = { version = "0.9.0", default-features = false, features = [
  "macros",
  "migrate",
  "runtime-tokio",
  "sqlite",
] }
thiserror = "2.0.20"
tokio = "1.53.1"
# Matched to reqwest's, which is already in the tree — 0.7 would put two
# copies of it there for one middleware.
tower-http = { version = "0.6.11", features = ["cors", "fs", "trace"] }
tracing = "0.1.42"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tokio-util = { version = "0.7.19", features = ["io"] }
uuid = { version = "1.26.0", features = ["serde"] }

[workspace.lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# A name on crates.io cannot be given back and a version cannot be withdrawn,
# so the default stays safe and each crate opts in.
[workspace.metadata]
publish = false
