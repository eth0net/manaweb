# The deny job, defined once and reached two ways: CI calls it on a push or a
# pull request, and the schedule runs it against a tree nobody has touched.
# Action majors verified with `ci.yaml`'s, on the date its header names.

name: advisories

on:
  schedule:
    # An advisory is published against code that has already shipped, so a
    # trigger tied to a change never fires for the case that matters. GitHub
    # stops scheduling this after 60 days without a commit, which is its own
    # signal.
    - cron: "17 7 * * *"
  workflow_dispatch:
  workflow_call:

jobs:
  deny:
    name: supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          # What `just deny` runs, so a local check and this one agree about
          # an unmaintained crate.
          command-arguments: --deny warnings
