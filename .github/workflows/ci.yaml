# Action majors verified 2026-09-07 against
# `gh api repos/<owner>/<repo>/releases/latest --jq .tag_name`.

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --all-targets

  lint:
    name: fmt and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets --all-features

  deny:
    name: supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          # The advisory database moves on its own, so this can fail on an
          # unchanged tree. That's the point.
          command-arguments: --deny warnings

  typos:
    name: spelling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Reads `typos.toml`, so `locale = "en-us"` applies here too.
      - uses: crate-ci/typos@v1.50.1

  lexicons:
    name: lexicons
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
        working-directory: tools/lexicon-check
      - run: bun run gen --check
        working-directory: tools/lex-gen

  prose:
    name: prose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
        working-directory: tools/prose-check

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
        working-directory: web
      - run: bun run types
        working-directory: web
      - run: bun test
        working-directory: web
      - run: bun run build
        working-directory: web

  msrv:
    name: minimum supported rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Read from Cargo.toml so rust-version is the only place the floor lives.
      - id: msrv
        run: >-
          sed -n 's/^rust-version = "\(.*\)"/version=\1/p' Cargo.toml
          >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked
