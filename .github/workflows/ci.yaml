# Action majors verified 2026-10-26 against
# `gh api repos/<owner>/<repo>/releases/latest --jq .tag_name`.

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      # No toolchain action: `rust-toolchain.toml` names the compiler, and
      # one that installed `stable` here would be overridden by it anyway.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --all-targets

  lint:
    name: fmt and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets --all-features

  deny:
    uses: ./.github/workflows/advisories.yaml

  typos:
    name: spelling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Reads `typos.toml`, so `locale = "en-us"` applies here too.
      - uses: crate-ci/typos@v1.51.1

  lexicons:
    name: lexicons
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
        working-directory: tools/lexicon-check
      - run: bun run gen --check
        working-directory: tools/lex-gen

  prose:
    name: prose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
        working-directory: tools/prose-check

  scanner:
    name: scanner on wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      # The comparison below builds with the hook's own recipe, not a copy.
      - uses: extractions/setup-just@v4
      - run: bun install --frozen-lockfile
      # Reads the committed module beside one built here, so the bytes a
      # browser is served are what this answers for.
      - run: bun run check
        working-directory: tools/scanner-check
      # Reports only: the gate this would be failed every run in October with
      # the compiler already pinned — `docs/scanner.md`.
      - name: engine bytes
        run: |
          built=target/wasm32-unknown-unknown/wasm/manaweb_scanner.wasm
          shipped=web/src/scan/engine.wasm
          size() { wc -c <"$1" | tr -d ' '; }
          # The step above builds to this same path under other flags, so
          # without this a failed build here is compared as though it were ours.
          rm -f "$built"
          if ! just engine-build; then
            said="nothing built here to compare the committed module against"
          elif cmp -s "$built" "$shipped"; then
            said="the rebuild matches the committed module"
          elif [ "$(size "$built")" != "$(size "$shipped")" ]; then
            # Counting below stops at the shorter file, so it would answer
            # zero here and a differing module would read as an equal one.
            said="$(size "$built") bytes built against $(size "$shipped") committed"
          else
            # `cmp -l` exits 1 on any difference and the job's shell is
            # `-e -o pipefail`, so counting one has to swallow its status.
            differ=$(cmp -l "$built" "$shipped" | wc -l | tr -d ' ') || true
            said="$differ of $(size "$shipped") bytes differ"
          fi
          printf 'engine bytes: %s\n' "$said" | tee -a "$GITHUB_STEP_SUMMARY"

  typescript:
    name: typescript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # One scope for the client and the tools: the tools import the client's
      # own modules, so a change to those has to typecheck against both.
      - run: bun run lint
      - run: bun run types
      # Not optional: a runner orders the files differently from a laptop, and
      # one of them puts the rendering tests before what they would reach.
      - run: bun test --isolate
      - run: bun run build

  msrv:
    name: minimum supported rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Read from Cargo.toml so rust-version is the only place the floor lives.
      - id: msrv
        run: >-
          sed -n 's/^rust-version = "\(.*\)"/version=\1/p' Cargo.toml
          >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      # `+` rather than the default the action set: `rust-toolchain.toml`
      # beats that, and the floor would go unchecked without a word.
      - run: cargo +${{ steps.msrv.outputs.version }} check --locked

  container:
    name: container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # The slowest job here, and still cheaper than hearing from someone else
      # that the image never built. It proves the entrypoint, not the service.
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: manaweb:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker run --rm manaweb:ci version
