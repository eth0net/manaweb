# Action majors verified 2026-09-20 against
# `gh api repos/<owner>/<repo>/releases/latest --jq .tag_name`.

name: Release

on:
  push:
    tags: ['v*']

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  version:
    name: tag matches the manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The version reaches Scryfall in our user agent, and the image is
      # published under the tag, so a mismatch has to stop before either.
      # `tools/hooks/reference-transaction` catches it before the tag exists;
      # this catches a tag pushed from somewhere without hooks.
      - name: compare
        run: |
          held=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "manaweb-appview") | .version')
          tag=${GITHUB_REF_NAME#v}
          test "$held" = "$tag" \
            || { echo "tag $tag against manifest $held"; exit 1; }

  image:
    name: publish the image
    runs-on: ubuntu-latest
    needs: version
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # `latest` only from a real release, never a prerelease tag.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: latest=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # amd64 only: the host is an amd64 VPS, and arm64 under QEMU is a
          # Rust release build through an emulator. A native runner when
          # something actually needs one.
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
