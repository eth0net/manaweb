# `.github/dependabot.yml`. Dependabot reads only this spelling, so it is the
# one place `.yml` beats the `.yaml` the rest of the repo uses.
version: 2
updates:
  # Grouped under one pattern so a week's bumps arrive as a single PR.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
    ignore:
      # Its version is reqwest's to choose — see the workspace manifest. Lift
      # this when reqwest moves, and take both together.
      - dependency-name: tower-http
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Bun rather than npm: a `bun.lock` with no `package-lock.json` is Bun's to
  # update, and the npm ecosystem aborts on one rather than passing it over.
  # The one workspace at the root covers `web/` and every `tools/` package.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      bun:
        patterns: ["*"]
