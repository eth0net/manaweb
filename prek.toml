#:schema https://www.schemastore.org/prek.json
#
#     prek install
#
# Read-only checks on pre-commit, anything that compiles on pre-push, the
# sign-off check on commit-msg.

default_install_hook_types = ["pre-commit", "pre-push", "commit-msg"]

# Bundled with prek, so a fresh checkout runs these offline.
[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace", args = ["--markdown-linebreak-ext=md"] },
  { id = "end-of-file-fixer" },
  # Catches a file that landed before .gitattributes applied.
  { id = "mixed-line-ending", args = ["--fix=lf"] },
  { id = "check-merge-conflict" },
  { id = "check-case-conflict" },
  # Windows is a CI platform, so a path that can't exist there fails there.
  # Pinned to pre-commit: with no stages it also runs at commit-msg, where the
  # only path it is handed is the message, and from a worktree that path
  # climbs out of the checkout and it refuses its own repository.
  { id = "check-illegal-windows-names", stages = ["pre-commit"] },
  { id = "check-added-large-files" },
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "check-json" },
]

# Neither builtin nor `system`: prek installs a pinned binary, so nothing has
# to be on PATH. Upstream's `--write-changes` is dropped — a spell checker
# editing prose unasked is worse than one that names the line. Config, and what
# it excludes, in `typos.toml`.
[[repos]]
repo = "https://github.com/crate-ci/typos"
rev = "v1.50.1"
hooks = [{ id = "typos", args = ["--force-exclude"] }]

# Scoped to Rust files so touching only docs or lexicons needs no toolchain.
[[repos]]
repo = "local"
hooks = [
  # Formats in place and fails if anything moved, so the fix is `git add`.
  { id = "cargo-fmt", name = "cargo fmt", entry = "cargo fmt --all", language = "system", files = '\.rs$', pass_filenames = false, require_serial = true },
  { id = "cargo-clippy", name = "cargo clippy", entry = "cargo clippy --all-targets -- -D warnings", language = "system", files = '\.rs$|(^|/)Cargo\.(toml|lock)$', pass_filenames = false, require_serial = true },
  # Matches CI, so a red push costs no CI round trip.
  { id = "cargo-test", name = "cargo test", entry = "cargo test --all-targets", language = "system", files = '\.rs$|(^|/)Cargo\.(toml|lock)$', pass_filenames = false, require_serial = true, stages = ["pre-push"] },
]

# Scoped to `web/`, and `system` for the same reason the cargo hooks are: bun
# is needed to work on the client at all. `tsc` waits for pre-push, being the
# slow one.
[[repos]]
repo = "local"
hooks = [
  { id = "biome", name = "biome check", entry = "bun run lint", language = "system", files = '\.(ts|tsx|css)$|(^|/)(package\.json|tsconfig\.json|biome\.json)$', pass_filenames = false, require_serial = true },
  { id = "tsc", name = "tsc", entry = "bun run types", language = "system", files = '\.(ts|tsx|css)$|(^|/)(package\.json|tsconfig\.json|biome\.json)$', pass_filenames = false, require_serial = true, stages = ["pre-push"] },
  { id = "bun-test", name = "bun test", entry = "bun test", language = "system", files = '\.(ts|tsx|css)$|(^|/)(package\.json|tsconfig\.json|biome\.json)$', pass_filenames = false, require_serial = true, stages = ["pre-push"] },
]

# The engine a browser is served is committed, and what deploys it is the push
# rather than a build anyone here runs — so a drifted one is live before CI
# says a word. On push, therefore, which is the last point anything can stop
# it. Scoped so that only work on the engine pays for it, and wants the
# wasm32 target.
[[repos]]
repo = "local"
hooks = [
  # Byte for byte, which needs no test to have been kept up to date with what
  # the engine does.
  { id = "engine", name = "engine is its source rebuilt (just engine-check)", entry = "just engine-check", language = "system", files = '^crates/scanner/|(^|/)Cargo\.(toml|lock)$|^justfile$|^web/src/scan/engine\.wasm$', pass_filenames = false, require_serial = true, stages = ["pre-push"] },
  # And the other question, which bytes cannot answer: that the build for the
  # browser and the one for a test agree about what a picture hashes to.
  { id = "scanner", name = "wasm answers what native does (just scanner)", entry = "just scanner", language = "system", files = '^crates/scanner/|^tools/scanner-check/|^web/src/scan/engine\.(wasm|ts)$', pass_filenames = false, require_serial = true, stages = ["pre-push"] },
]

# Spans both sides, so it isn't scoped to either toolchain's files. 40ms, which
# is why it runs on commit rather than on push.
[[repos]]
repo = "local"
hooks = [
  { id = "prose", name = "prose", entry = "cd tools/prose-check && bun run check", language = "system", files = '\.(rs|ts|tsx|css|md)$', pass_filenames = false, require_serial = true },
]

# The sign-off CONTRIBUTING asks for. Git has no `commit.signOff`, so an
# unenforced convention is the only alternative. Merge commits are exempt, as
# DCO checks conventionally are — they carry no new work to certify.
[[repos]]
repo = "local"
hooks = [
  { id = "dco", name = "sign-off (git commit -s)", entry = "grep -qE '^(Signed-off-by: |Merge )'", language = "system", stages = ["commit-msg"] },
]
