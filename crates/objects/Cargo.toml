[package]
name = "manaweb-objects"
version.workspace = true
description = "The bucket our static artifacts are served from."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

# The hand-run half. Named for the job rather than the crate, because it is
# what `just upload` and anyone at a shell reaches for.
[[bin]]
name = "manaweb-upload"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
futures-util.workspace = true
reqwest.workspace = true
object_store = { version = "0.14.2", default-features = false, features = ["aws"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "macros", "rt-multi-thread"] }
tracing.workspace = true

[dev-dependencies]
chrono.workspace = true
axum.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread"] }
