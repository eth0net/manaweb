[package]
name = "manaweb-artwork"
version.workspace = true
description = "Pulls Scryfall's artwork and hashes it into the store the export publishes from."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "manaweb-artwork"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
manaweb-scanner.workspace = true
manaweb-scryfall.workspace = true

# PNG as well as JPEG: a reported frame is written as the bytes the engine
# read, which is what lets it be scored without the card being shot again.
image = { version = "0.25.9", default-features = false, features = [
    "jpeg",
    "png",
] }
reqwest.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "macros", "rt-multi-thread", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
