[package]
name = "manaweb-artwork"
version.workspace = true
description = "Pulls Scryfall's artwork and hashes it into the store the export publishes from."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "manaweb-artwork"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
manaweb-scanner.workspace = true
manaweb-scryfall.workspace = true

# png beside jpeg so a directory of photographs exported either way scores.
image = { version = "0.25.9", default-features = false, features = [
    "jpeg",
    "png",
] }
reqwest.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "macros", "rt-multi-thread", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
