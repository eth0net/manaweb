[package]
name = "manaweb-scan"
version.workspace = true
description = "The scanner index: a perceptual hash per artwork, built from Scryfall's images."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "manaweb-scan"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
manaweb-scryfall.workspace = true

image = { version = "0.25.9", default-features = false, features = ["jpeg"] }
reqwest.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "macros", "rt-multi-thread", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
